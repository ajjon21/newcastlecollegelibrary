{% extends "base.html" %}{% block content %}<div class="heading"><div><p class="eyebrow">CATALOGUE</p><h1>{{ 'Edit book' if book else 'Add a book' }}</h1></div></div><form class="panel form" method="post">
<label>Title *<input name="title" required value="{{ book.title if book else '' }}"></label><label>Author *<input name="author" required value="{{ book.author if book else '' }}"></label><label>ISBN *<input name="isbn" required value="{{ book.isbn if book else '' }}"></label><label>Genre *<input name="genre" required value="{{ book.genre if book else '' }}"></label><label>Total copies *<input type="number" min="1" name="copies" required value="{{ book.total_copies if book else 1 }}"></label><div class="actions"><button>Save book</button><a class="button secondary" href="{{ url_for('books') }}">Cancel</a></div></form>{% endblock %}
