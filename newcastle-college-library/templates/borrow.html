{% extends "base.html" %}{% block content %}<div class="heading"><div><p class="eyebrow">CIRCULATION</p><h1>Issue or queue a book</h1><p class="muted">If no copies are available, the member is added to the FIFO waitlist.</p></div></div><form class="panel form" method="post"><label>Book *<select name="book_id" required><option value="">Choose a book</option>{% for b in books %}<option value="{{ b.id }}">{{ b.title }} — {{ b.available_copies }} available</option>{% endfor %}</select></label><label>Member *<select name="member_id" required><option value="">Choose a member</option>{% for m in members %}<option value="{{ m.id }}">{{ m.member_code }} — {{ m.name }}</option>{% endfor %}</select></label><p class="muted">Standard loan period: 14 days. Prototype limit: five active loans per member.</p><div class="actions"><button>Continue</button><a class="button secondary" href="{{ url_for('loans') }}">Cancel</a></div></form>{% endblock %}
